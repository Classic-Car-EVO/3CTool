name: GPU tests

# Self-hosted GPU runner: manual trigger only until the runner is registered.
# Never run this workflow for pull requests from forks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-test:
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/ThreeCTool.Gpu.Tests/ThreeCTool.Gpu.Tests.csproj -c Release
